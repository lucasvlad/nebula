[package]
name = "nebula-node"
description = "A running Nebula device: the sync daemon, pairing and status, shared by the CLI and the app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.105"
directories = "6.0.0"
gethostname = "1.1.0"
if-addrs = "0.15.0"
nebula-core = { version = "0.1.0", path = "../nebula-core" }
nebula-net = { version = "0.1.0", path = "../nebula-net" }
nebula-sync = { version = "0.1.0", path = "../nebula-sync" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
