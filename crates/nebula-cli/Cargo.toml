[package]
name = "nebula-cli"
description = "The `nebula` command-line tool and daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "nebula"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
gethostname = "1.1.0"
if-addrs = "0.15.0"
nebula-core = { version = "0.1.0", path = "../nebula-core" }
nebula-net = { version = "0.1.0", path = "../nebula-net" }
nebula-sync = { version = "0.1.0", path = "../nebula-sync" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
