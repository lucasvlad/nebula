[package]
name = "nebula-net"
description = "Framing, Noise transport, SPAKE2 pairing and mDNS discovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
getrandom = "0.4.3"
nebula-core = { version = "0.1.0", path = "../nebula-core" }
mdns-sd = "0.21.5"
snow = "0.10.0"
spake2 = "0.4.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net", "io-util", "time", "rt", "macros", "sync"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
