[package]
name = "nebula-sync"
description = "Scanner, watcher, index exchange, chunk transfer and atomic apply."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
blake3 = "1.8.7"
nebula-core = { version = "0.1.0", path = "../nebula-core" }
notify-debouncer-mini = "0.7.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
