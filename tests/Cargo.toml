[package]
name = "nebula-tests"
description = "Cross-crate integration tests and the fault-injection TCP proxy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
nebula-core = { version = "0.1.0", path = "../crates/nebula-core" }
nebula-net = { version = "0.1.0", path = "../crates/nebula-net" }
nebula-sync = { version = "0.1.0", path = "../crates/nebula-sync" }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "mitm-demo"
path = "src/bin/mitm_demo.rs"
